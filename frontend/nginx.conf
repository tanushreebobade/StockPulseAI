server {
    listen 80;
    server_name localhost;

    # Root directory where compiled React static files reside
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Static assets caching
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # NOTE: On Render, API & WebSocket calls go directly to the backend
    # Render service URL via REACT_APP_BACKEND_URL env var at build time.
    # No nginx proxy needed — React calls backend URL directly.

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
